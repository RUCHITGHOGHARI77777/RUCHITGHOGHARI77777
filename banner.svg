<svg width="100%" height="190" viewBox="0 0 900 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0" y1="0" x2="900" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="50%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Animated Border Gradient Beam -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0">
        <animate attributeName="stop-color" values="#00F0FF;#7000FF;#00FF66;#00F0FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1">
        <animate attributeName="stop-color" values="#00F0FF;#00FFCC;#7000FF;#00F0FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0">
        <animate attributeName="stop-color" values="#7000FF;#00F0FF;#00FF66;#7000FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141724" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="30" cy="30" r="0.75" fill="#202538"/>
    </pattern>

    <!-- Core Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="190" rx="16" fill="url(#cyberBg)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="900" height="190" rx="16" fill="url(#techGrid)"/>

  <!-- Static Base Subtle Border -->
  <rect x="1" y="1" width="898" height="188" rx="15" fill="none" stroke="#1A1D2B" stroke-width="1.5"/>

  <!-- Live Animated Border Beam (Circuit Laser running endlessly) -->
  <rect x="1" y="1" width="898" height="188" rx="15" fill="none" stroke="url(#laserBeam)" stroke-width="2.5" stroke-dasharray="180 840" stroke-dashoffset="0" filter="url(#laserGlow)">
    <animate attributeName="stroke-dashoffset" from="1020" to="0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- High-Tech Corner Architectural Brackets -->
  <path d="M 22 14 L 14 14 L 14 22" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 878 14 L 886 14 L 886 22" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 22 176 L 14 176 L 14 168" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 878 176 L 886 176 L 886 168" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Ambient Energy Core -->
  <ellipse cx="450" cy="95" rx="240" ry="50" fill="#00F0FF" opacity="0.04" filter="blur(40px)"/>

  <!-- Typography Content -->
  <g text-anchor="middle">
    <!-- Main High-Tech Name -->
    <text x="450" y="74" fill="#FFFFFF" font-family="'Orbitron', 'Rajdhani', 'Space Grotesk', 'Chakra Petch', 'JetBrains Mono', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="3.5">RUCHIT GHOGHARI</text>
    
    <!-- Architect Tech Subtitle -->
    <text x="450" y="108" fill="#94A3B8" font-family="'JetBrains Mono', 'Roboto Mono', 'SF Mono', 'Fira Code', monospace" font-size="13" font-weight="600" letter-spacing="2">SYSTEMS ARCHITECT • DISTRIBUTED ENGINES • AUTONOMOUS AI SYSTEMS</text>
    
    <!-- Clean Email Row Without Pill Box -->
    <g transform="translate(450, 144)">
      <!-- Animated Pulsing Online Indicator -->
      <circle cx="-135" cy="-4" r="3.5" fill="#00F0FF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;4.2;3" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Mail Icon -->
      <path d="M -120 -9.5 L -107 -0.5 L -94 -9.5 M -122 -11 H -92 C -91 -11 -90 -10 -90 -9 V 1 C -90 2 -91 3 -92 3 H -122 C -123 3 -124 2 -124 1 V -9 C -124 -10 -123 -11 -122 -11 Z" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Direct Email Text (Futuristic Monospace) -->
      <text x="15" y="-1" fill="#E2E8F0" font-family="'JetBrains Mono', 'Roboto Mono', 'SF Mono', monospace" font-size="14" font-weight="600" letter-spacing="1">ruchitghoghari@rgai.in</text>
    </g>
  </g>
</svg>
